# Permissions of the execution service. It runs in namespace "magi" and
# makes environments in namespace "magi-envs" only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: execution
  namespace: magi
  labels:
    app.kubernetes.io/part-of: magi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: magi-execution
  namespace: magi-envs
  labels:
    app.kubernetes.io/part-of: magi
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/status", "pods/log"]
    verbs: ["get"]
  # pods/exec: push delivery. pods/portforward: port-forward connection.
  # GET is for WebSocket upgrades, POST (create) for SPDY.
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: magi-execution
  namespace: magi-envs
  labels:
    app.kubernetes.io/part-of: magi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: magi-execution
subjects:
  - kind: ServiceAccount
    name: execution
    namespace: magi

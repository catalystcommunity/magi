[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magi-apprentice"
version = "0.1.0"
description = "Magi-owned coding apprentice harness: model loop with tools in a Magi execution environment"
requires-python = ">=3.11"
license = "MIT"
dependencies = []  # stdlib only; the generated clients come from clients/python

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
magi-apprentice = "magi_apprentice.__main__:main"

[tool.setuptools]
packages = ["magi_apprentice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]

[package]
name = "magi-release"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "magi_release"
path = "src/lib.rs"

[[bin]]
name = "magi-release"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
ed25519-dalek = "2"
futures = "0.3"
http = "1"
k8s-openapi = { version = "0.28", features = ["v1_32"] }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

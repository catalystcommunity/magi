name: opal-dialogue
services:
  postgres:
    image: postgres@sha256:0b657ff48d7f76a1e907f381b1693eb4f2bf54c1d2df4feb6743d7dc601768dd
    environment:
      POSTGRES_PASSWORD: local-dialogue-only
    ports: ["127.0.0.1:25436:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 20
    mem_limit: 512m
    cpus: 2
    pids_limit: 256
  corndogs-volume-init:
    image: postgres@sha256:0b657ff48d7f76a1e907f381b1693eb4f2bf54c1d2df4feb6743d7dc601768dd
    user: "0:0"
    entrypoint: ["chown", "65532:65532", "/data"]
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    security_opt: ["no-new-privileges:true"]
    volumes: ["corndogs:/data"]
    mem_limit: 32m
    pids_limit: 16
  corndogs:
    image: ${MAGI_CORNDOGS_IMAGE:?Set MAGI_CORNDOGS_IMAGE to a pinned Corndogs image}
    depends_on:
      corndogs-volume-init:
        condition: service_completed_successfully
    environment:
      STORAGE_BACKEND: file
      CORNDOGS_FILESTORE_DIR: /data
      CORNDOGS_FILESTORE_SYNC: always
      CORNDOGS_SUBMISSION_KEY_POLICY: required
      CORNDOGS_TASK_GUARD_POLICY: required
      LOGLEVEL: error
    ports: ["127.0.0.1:25082:5080"]
    volumes: ["corndogs:/data"]
    mem_limit: 512m
    cpus: 2
    pids_limit: 256
volumes:
  postgres:
  corndogs:

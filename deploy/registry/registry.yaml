# Magi-owned image registry with its own credentials. Nodes pull from
# localhost:30500 (kube-proxy accepts localhost NodePorts; containerd uses
# plain HTTP for localhost). Push through a port-forward to the Service.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry
  namespace: magi
  labels: {app.kubernetes.io/part-of: magi, app.kubernetes.io/name: registry}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources: {requests: {storage: 30Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: magi
  labels: {app.kubernetes.io/part-of: magi, app.kubernetes.io/name: registry}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: registry}}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: magi, app.kubernetes.io/name: registry}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/arch: amd64}
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: registry
          image: registry:2.8.3
          env:
            - {name: REGISTRY_AUTH, value: htpasswd}
            - {name: REGISTRY_AUTH_HTPASSWD_REALM, value: magi}
            - {name: REGISTRY_AUTH_HTPASSWD_PATH, value: /auth/htpasswd}
            - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
          ports: [{name: http, containerPort: 5000}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: "1", memory: 512Mi}}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
            - {name: auth, mountPath: /auth, readOnly: true}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: registry}}
        - {name: auth, secret: {secretName: registry-htpasswd}}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: magi
  labels: {app.kubernetes.io/part-of: magi, app.kubernetes.io/name: registry}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: registry}
  ports: [{name: http, port: 5000, targetPort: http, nodePort: 30500}]
